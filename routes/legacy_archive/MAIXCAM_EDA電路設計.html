<style>
:root{--bg:#e9edf2;--paper:#fff;--ink:#222;--wire:#168b48;--pin:#a33;--part:#1671a8;--power:#c33;--grid:#dbe6ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Segoe UI","Microsoft JhengHei",sans-serif;color:#253245}
header{background:#263548;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 2px 8px #0003}

.viewport{max-width:1500px;margin:12px auto 20px;overflow:auto;background:#737d87;padding:12px;border-radius:7px;box-shadow:0 7px 24px #25324535;min-height:600px}
.sheet{display:none;transform-origin:top left}.sheet.active{display:block}
svg{display:block;background:var(--paper);width:1400px;height:900px;box-shadow:0 1px 6px #0006}
.gridline{stroke:var(--grid);stroke-width:.5}.wire{stroke:var(--wire);stroke-width:2;fill:none}.bus{stroke:#17629a;stroke-width:4;fill:none}.junction{fill:var(--wire)}.part{stroke:var(--part);stroke-width:2;fill:#fff}.partfill{fill:#eef8fd;stroke:var(--part);stroke-width:2}.pin{stroke:var(--pin);stroke-width:1.6}.power{stroke:var(--power);fill:none;stroke-width:2}.gnd{stroke:#222;fill:none;stroke-width:1.5}
text{font-family:"Segoe UI","Microsoft JhengHei",sans-serif;fill:var(--ink);font-size:12px}.ref{fill:#146f9c;font-weight:700}.value{font-size:11px}.net{fill:#14733b;font-weight:700}.label{fill:#fff;font-weight:700}.title{font-size:21px;font-weight:700}.subtitle{font-size:12px;fill:#586579}.note{font-size:11px;fill:#7b4c00}.pinname{font-size:10px;fill:#943838}
.frame{fill:none;stroke:#333;stroke-width:1}.frameBold{fill:none;stroke:#333;stroke-width:2}.titlebox text{font-size:10px}.titlebox .big{font-size:17px;font-weight:700}
.hidden{display:none}footer{text-align:center;color:#607083;font-size:11px;padding:0 0 18px}
@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.notice,.viewport{margin-left:7px;margin-right:7px}}
@media print{header,.notice,footer{display:none}.viewport{margin:0;padding:0;box-shadow:none;overflow:visible;background:#fff}.sheet{display:block!important;page-break-after:always;transform:none!important}svg{box-shadow:none;width:100%;height:auto}}
</style>

<script>
let zoom=1;
const sheets=[...document.querySelectorAll(".sheet")];
function applyZoom(){sheets.forEach(s=>s.style.transform=`scale(${zoom})`);document.getElementById("zoomReset").textContent=Math.round(zoom*100)+"%"}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));sheets.forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.sheet).classList.add("active")});
document.getElementById("zoomIn").onclick=()=>{zoom=Math.min(1.6,zoom+.1);applyZoom()};
document.getElementById("zoomOut").onclick=()=>{zoom=Math.max(.5,zoom-.1);applyZoom()};
document.getElementById("zoomReset").onclick=()=>{zoom=1;applyZoom()};
</script>
